[workspace]
members = ["crates/campus-core", "crates/campus-platform", "crates/campus-cli"]
default-members = ["crates/campus-cli"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
tokio = { version = "1", features = ["time"] }
zeroize = "1"

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
