[package]
name = "campus-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
dirs = "6"
if-addrs = "0.15"
if-watch = { version = "3.2", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_IpHelper"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
objc2-core-wlan = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSSet", "NSString"] }
